<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div ID="D1">
        <h1>CALCULATOR</h1>
        <div id="D2">
            <span id="n1"></span>
            <span id="op"></span>
            <span id="n2"></span>
            <span id="out"></span>
        </div>
        <div id="D3">
            <button id="1" onclick="num(1)">1</button>
            <button id="2" onclick="num(2)">2</button>
            <button id="sum" onclick="num('sum')">+</button>
            <button id="3" onclick="num(3)">3</button>
            <button id="4" onclick="num(4)">4</button>
            <button id="sub" onclick="num('sub')">-</button>
            <button id="5" onclick="num(5)">5</button>
            <button id="6" onclick="num(6)">6</button>
            <button id="prd" onclick="num('prd')">*</button>
            <button id="7" onclick="num(7)">7</button>
            <button id="8" onclick="num(8)">8</button>
            <button id="div" onclick="num('div')">/</button>
            <button id="9" onclick="num(9)">9</button>
            <button id="0" onclick="num(0)">0</button>
            <button id="eq" onclick="num('eq')">=</button>
            
        </div>
        
    </div>
    <script src="index.js"></script>
</body>

</html>
